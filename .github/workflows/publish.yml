name: Publish package release

on:
  workflow_call:
    inputs:
      package-directory:
        description: Workspace-relative directory containing the npm package.
        required: true
        type: string
      release-tag-prefix:
        description: Prefix for the package-specific GitHub release tag.
        required: true
        type: string
      tested-sha:
        description: Successful CI revision that this release is allowed to publish.
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_publish: ${{ steps.check.outputs.should_publish }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - name: Checkout the CI-tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tested-sha }}

      - name: Verify the tested revision is still main
        id: revision
        env:
          TESTED_SHA: ${{ inputs.tested-sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "Checked out revision does not match the successful CI run" >&2
            exit 1
          fi

          git fetch --no-tags origin main

          if [ "$(git rev-parse origin/main)" != "$TESTED_SHA" ]; then
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale successful CI revision $TESTED_SHA"
            exit 0
          fi

          echo "is_current=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.revision.outputs.is_current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check whether the package needs publishing or a release
        if: steps.revision.outputs.is_current == 'true'
        id: check
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
          RELEASE_TAG_PREFIX: ${{ inputs.release-tag-prefix }}
        run: |
          npm_registry() {
            (cd "$RUNNER_TEMP" && npm "$@")
          }

          npm_registry ping --registry=https://registry.npmjs.org

          PACKAGE_NAME=$(node -p "require('./$PACKAGE_DIRECTORY/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./$PACKAGE_DIRECTORY/package.json').version")
          RELEASE_TAG="${RELEASE_TAG_PREFIX}v${PACKAGE_VERSION}"
          echo "Current package: $PACKAGE_NAME@$PACKAGE_VERSION"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if npm_registry view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout the CI-tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tested-sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: pnpm exec vp -C "$PACKAGE_DIRECTORY" pack

      - name: Verify npm supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"

          node -e "
            const version = process.argv[1].split('.').map(Number)
            const minimum = [11, 5, 1]

            for (let i = 0; i < minimum.length; i++) {
              if (version[i] > minimum[i]) process.exit(0)
              if (version[i] < minimum[i]) process.exit(1)
            }
          " "$NPM_VERSION"

      - name: Reconfirm the published revision
        env:
          TESTED_SHA: ${{ inputs.tested-sha }}
        run: |
          git fetch --no-tags origin main

          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ] || [ "$(git rev-parse origin/main)" != "$TESTED_SHA" ]; then
            echo "Refusing to publish a revision that is no longer the tip of main" >&2
            exit 1
          fi

      - name: Publish package to npm
        working-directory: ${{ inputs.package-directory }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
            exit 0
          fi

          if npm publish; then
            exit 0
          fi

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION was published by a concurrent run"
            exit 0
          fi

          exit 1

  release:
    needs:
      - check-version
      - publish
    if: >-
      needs.check-version.outputs.should_release == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release-tag-prefix }}v${{ needs.check-version.outputs.version }}
          name: ${{ inputs.release-tag-prefix }}v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ inputs.tested-sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
