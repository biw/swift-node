name: Publish swift-node

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: swift-node-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/publish.yml
    with:
      package-directory: packages/swift-node
      release-tag-prefix: swift-node-
      tested-sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
